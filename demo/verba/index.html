<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d2828">
<title>ВЕРБА — одяг (демо)</title>
<meta name="description" content="ВЕРБА — магазин повсякденного одягу: джинси, штани, кофти, сорочки, футболки, шапки й рукавички. Доставка Новою Поштою, примірка при отриманні.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap">
<script src="boot.js"></script>
<style>
/* Layout: sticky 3D stage (hero → circular portal → clothing rail with focus view), categories, catalog, sizes, footer */
:root{
  color-scheme: dark;
  --bg:#0d2828; --bg-2:#143938; --surface:#143938; --surface-hi:#1c4746;
  --fg:#ece4f4; --fg-dim:#a9c0bb; --line:rgba(236,228,244,.14); --line-strong:rgba(236,228,244,.25);
  --accent:#f4a77c; --accent-text:#f4a77c; --on-accent:#0d2828; --lilac:#b9a3e3; --sage:#9cc7b0;
  --alt-bg:#ece4f4; --alt-fg:#0d2828; --alt-dim:#4b5f5e; --alt-line:rgba(13,40,40,.14); --alt-accent:#b25d33; --alt-glass:rgba(255,255,255,.72);
  --alt-glow-1:#f7d9c4; --alt-glow-2:#cfc0ea;
  --m-bg:#ece4f4; --m-fg:#0d2828; --m-dim:#4b5f5e; --m-line:rgba(13,40,40,.14);
  --hdr:rgba(13,40,40,.72); --pill:rgba(13,40,40,.4);
  --brand-grad:linear-gradient(95deg,#fff3d6 0%,#f6d08a 18%,#ff9e7a 38%,#ff7f8f 50%,#ffb48a 64%,#f6d08a 80%,#fff3d6 100%);
  --brand-glow:rgba(255,140,110,.25);
  --f-display:"Montserrat Alternates", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
}
:root[data-site="light"]{
  color-scheme: light;
  --bg:#f6f2f8; --bg-2:#efe8f4; --surface:#ffffff; --surface-hi:#f3edf8;
  --fg:#13302f; --fg-dim:#5b6f6d; --line:rgba(19,48,47,.12); --line-strong:rgba(19,48,47,.22);
  --accent:#f4a77c; --accent-text:#b4572b; --on-accent:#13302f;
  --alt-bg:#0f2e2d; --alt-fg:#ece4f4; --alt-dim:#a9c0bb; --alt-line:rgba(236,228,244,.16); --alt-accent:#f4a77c; --alt-glass:rgba(13,40,40,.55);
  --alt-glow-1:rgba(244,167,124,.28); --alt-glow-2:rgba(185,163,227,.30);
  --m-bg:#ffffff; --m-fg:#13302f; --m-dim:#5b6f6d; --m-line:rgba(19,48,47,.12);
  --hdr:rgba(246,242,248,.78); --pill:rgba(255,255,255,.6);
  --brand-grad:linear-gradient(95deg,#1f4f4c 0%,#2f6b5f 16%,#d0703f 36%,#c4486a 50%,#d0703f 64%,#7d5bc4 82%,#1f4f4c 100%);
  --brand-glow:rgba(208,112,63,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow-x:hidden;transition:background-color .6s var(--ease),color .6s var(--ease)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text)}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;padding-top:12px;padding-bottom:12px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background .5s,backdrop-filter .5s,border-color .5s;border-bottom:1px solid transparent}
.top.solid{background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.logo{font-family:var(--f-display);font-weight:800;letter-spacing:.08em;font-size:18px;text-decoration:none;color:var(--fg);display:flex;align-items:center;gap:10px}
.logo i{width:22px;height:22px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,var(--accent),var(--lilac));transform:rotate(-45deg);display:block}
.nav{display:flex;gap:24px}
.nav a{color:var(--fg-dim);text-decoration:none;font-size:14px;font-weight:600;transition:color .2s}
.nav a:hover{color:var(--fg)}
.ctrls{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--pill)}
.lang button{border:0;background:none;padding:5px 9px;font-size:12px;font-weight:800;letter-spacing:.04em;border-radius:999px;color:var(--fg-dim);transition:background .3s,color .3s}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.theme{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--pill);display:grid;place-items:center;padding:0}
.theme svg{width:18px;height:18px;transition:transform .7s var(--ease)}
.theme .sun{display:none}
:root[data-site="dark"] .theme .sun{display:block}
:root[data-site="dark"] .theme .moon{display:none}
.theme:hover svg{transform:rotate(25deg)}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.cart-btn svg{width:17px;height:17px}
.cart-btn b{background:var(--bg);color:var(--fg);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px;font-variant-numeric:tabular-nums}
.cart-btn.bump{animation:bump .6s var(--ease)}
@keyframes bump{35%{transform:scale(1.12)}}
@media (max-width:900px){.nav{display:none}}
@media (max-width:560px){.cart-btn .lbl{display:none}.cart-btn{padding:8px 10px}.logo{font-size:15px;gap:7px}.logo i{width:18px;height:18px}.lang button{padding:5px 7px}}

/* ---------- stage ---------- */
.stage{height:340vh;position:relative}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.hero{position:absolute;inset:0;background:
  radial-gradient(60% 50% at 18% 20%, rgba(185,163,227,.30), transparent 70%),
  radial-gradient(50% 45% at 85% 75%, rgba(244,167,124,.28), transparent 70%),
  radial-gradient(70% 60% at 50% 110%, rgba(156,199,176,.22), transparent 70%),
  var(--bg);perspective:1200px}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-copy{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:22px;padding-left:max(var(--gut-l), 6vw);padding-right:var(--gut-r);padding-block:90px 40px;pointer-events:none;will-change:transform,opacity,filter}
.hero-copy > *{pointer-events:auto}
.brand{font-weight:700;font-size:clamp(58px,14vw,210px);letter-spacing:.01em;line-height:.9;display:flex;perspective:600px;color:var(--fg)}
@property --sh{syntax:'<percentage>';inherits:true;initial-value:0%}
.brand span{display:inline-block;transform-origin:50% 100%;color:transparent;background:var(--brand-grad);background-size:600% 100%;background-position:calc(var(--i) * 20% + var(--sh)) 0;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 24px var(--brand-glow));animation:rise 1.4s var(--ease) both, shimmer 10s 1.6s ease-in-out infinite alternate}
@keyframes rise{from{transform:rotateX(-95deg) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{to{--sh:-60%}}
.lead{max-width:34ch;font-size:clamp(16px,1.6vw,20px);margin:0;animation:fade 1.2s .6s var(--ease) both}
.lead em{font-style:normal;color:var(--accent-text)}
.cta{display:flex;gap:12px;flex-wrap:wrap;animation:fade 1.2s .8s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(18px)}}
.btn{border:0;border-radius:999px;padding:14px 24px;font-weight:800;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 30px -10px rgba(244,167,124,.7)}
.btn.ghost{background:var(--pill);color:var(--fg);border:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:8px;max-width:540px;animation:fade 1.2s 1s var(--ease) both}
.tags button{font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--fg-dim);background:var(--pill)}
.tags button:hover{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.scroll-hint{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-dim);display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll-hint i{width:1px;height:36px;background:linear-gradient(var(--accent),transparent);animation:drip 2.2s var(--ease-io) infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.floaters{position:absolute;inset:0;pointer-events:none}
.fcard{pointer-events:auto;cursor:pointer;position:absolute;width:clamp(120px,14vw,190px);aspect-ratio:3/4;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);will-change:transform}
.fcard .ph{width:100%;height:100%}
.fcard:nth-child(1){right:22%;top:14%;--r:-8deg;animation:bob 8s ease-in-out infinite}
.fcard:nth-child(2){right:6%;top:40%;--r:9deg;animation:bob 9s -2s ease-in-out infinite}
.fcard:nth-child(3){right:26%;bottom:10%;--r:-4deg;animation:bob 10s -4s ease-in-out infinite}
.fcard:nth-child(4){right:4%;top:9%;--r:6deg;width:clamp(90px,9vw,130px);animation:bob 7s -1s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -16px}}
@media (max-width:760px){
  .fcard{opacity:.5}
  .fcard:nth-child(1){right:-6%;top:12%}
  .fcard:nth-child(3),.fcard:nth-child(4){display:none}
  .fcard:nth-child(2){right:-10%;top:auto;bottom:8%}
}

/* portal + rail */
.reveal{position:absolute;inset:0;background:
  radial-gradient(80% 60% at 50% 0%, var(--alt-glow-1) 0%, transparent 60%),
  radial-gradient(60% 50% at 100% 100%, var(--alt-glow-2) 0%, transparent 70%),
  var(--alt-bg);
  color:var(--alt-fg);clip-path:circle(0% at 50% 55%);display:flex;flex-direction:column;align-items:center;padding-top:calc(84px + env(safe-area-inset-top,0px));padding-left:var(--gut-l);padding-right:var(--gut-r);gap:6px;will-change:clip-path}
.reveal .eyebrow{color:var(--alt-accent)}
.reveal h2{font-size:clamp(28px,5vw,62px);text-align:center;letter-spacing:-.01em}
.reveal p.hint{font-size:14px;color:var(--alt-dim);margin:4px 0 0;text-align:center}
.reveal > .eyebrow,.reveal h2,.reveal p.hint{transition:opacity .6s var(--ease),transform .8s var(--ease)}
.reveal.focused > .eyebrow,.reveal.focused h2,.reveal.focused p.hint{opacity:0;transform:translateY(-14px)}
.rack-wrap{--gh:clamp(210px,40vh,350px);--sw:clamp(32px,3.1vw,48px);flex:1;width:100%;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;scrollbar-width:none;transition:opacity .8s var(--ease),filter .8s var(--ease),transform 1s var(--ease)}
.rack-wrap::-webkit-scrollbar{display:none}
.reveal.focused .rack-wrap{opacity:.1;filter:blur(5px);transform:scale(.95);pointer-events:none}
.rack{position:relative;margin:0 auto;padding:0 calc(var(--gh) * .36);min-width:max-content}
.rail{position:absolute;left:10px;right:10px;top:calc(var(--gh) * .03);height:7px;border-radius:8px;background:linear-gradient(#ffffff,#bdb6c9 55%,#8a8398);box-shadow:0 8px 12px -6px rgba(0,0,0,.4)}
.rail::before,.rail::after{content:"";position:absolute;top:-4px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9790a6)}
.rail::before{left:-6px}.rail::after{right:-6px}
.slots{display:flex;align-items:flex-start;perspective:1200px}
.slot{flex:none;position:relative;width:var(--sw);height:calc(var(--gh) * 1.08);border:0;padding:0;background:none;cursor:pointer;transition:translate 1.1s var(--ease)}
.slot .g{position:absolute;top:0;left:50%;width:calc(var(--gh) * .8);height:var(--gh);margin-left:calc(var(--gh) * -.4);transform-origin:50% 4%;transform:rotateY(calc(70deg + var(--j) * 6deg));transition:transform 1.2s var(--ease);will-change:transform}
.slot .g svg{width:100%;height:100%;display:block;overflow:visible}
.slot.open{z-index:5}
.slot.open .g{transform:rotateY(0deg) translateZ(30px)}
.slot.open .g .gsvg{animation:sway 3.2s .6s ease-in-out infinite}
.slot:focus-visible{outline:none}
.slot .nm{position:absolute;left:50%;top:calc(var(--gh) * 1.01);transform:translate(-50%,6px);white-space:nowrap;font-size:12px;font-weight:800;color:var(--alt-fg);opacity:0;transition:opacity .5s var(--ease),transform .7s var(--ease)}
.slot.open .nm{opacity:1;transform:translate(-50%,0)}
.gsvg{transform-box:fill-box;transform-origin:50% 0}
@keyframes sway{0%,100%{rotate:0deg}50%{rotate:1.4deg}}

.focus{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:10px;padding-top:calc(78px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:var(--gut-l);padding-right:var(--gut-r);opacity:0;pointer-events:none;transition:opacity .6s var(--ease);color:var(--alt-fg)}
.focus.on{opacity:1;pointer-events:auto}
.f-btn{position:absolute;z-index:3;border-radius:50%;border:1px solid var(--alt-line);background:var(--alt-glass);color:var(--alt-fg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:0;line-height:1}
.f-close{top:calc(84px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));width:40px;height:40px;font-size:22px}
.f-nav{top:42%;width:50px;height:50px;font-size:26px}
.f-nav.prev{left:max(16px, env(safe-area-inset-left,0px))}.f-nav.next{right:max(16px, env(safe-area-inset-right,0px))}
.f-stage{position:relative;width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1300px;overflow:visible}
.f-item{position:relative;height:100%;max-height:450px;aspect-ratio:200/250;max-width:70vw;transform-origin:50% 4%;will-change:transform;pointer-events:none}
.f-item svg{width:100%;height:100%;display:block;overflow:visible}
.f-item .gsvg{animation:sway 5s 1.2s ease-in-out infinite}
.tag{position:absolute;left:63%;top:6%;transform-origin:0 0;animation:tagswing 3.6s ease-in-out infinite}
.tag i{display:block;width:1px;height:44px;margin-left:6px;background:#8a8398;transform:rotate(-24deg);transform-origin:top}
.tag div{margin-top:-6px;margin-left:16px;background:#fff;border-radius:6px;padding:8px 10px 9px;box-shadow:0 10px 18px -8px rgba(13,40,40,.45);display:flex;flex-direction:column;gap:1px;position:relative;min-width:84px}
.tag div::before{content:"";position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#ece4f4;box-shadow:inset 0 0 0 1px rgba(13,40,40,.25)}
.tag b{font-family:var(--f-display);font-size:14px;margin-top:8px;color:#0d2828;white-space:nowrap}
.tag span{font-size:9px;letter-spacing:.18em;font-weight:800;color:#4b5f5e}
@keyframes tagswing{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.f-info{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:520px;width:100%}
.f-info h3{font-size:clamp(17px,2vw,22px);letter-spacing:.02em}
.f-info .meta{font-size:13px;color:var(--alt-dim);margin-top:-4px}
.f-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.f-info .sw[aria-pressed="true"]{border-color:var(--alt-fg)}
.f-info .sz{min-width:40px;padding:6px 9px;font-size:13px}
.f-info .sz[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.f-info .add{padding:12px 30px;font-size:14px;background:var(--alt-fg);color:var(--alt-bg)}
.f-info .esc{font-size:12px;color:var(--alt-dim)}
@media (max-width:600px){.rack-wrap{--gh:190px;--sw:28px}.f-nav{top:34%;width:42px;height:42px}.f-info .esc{display:none}}

/* ---------- marquee ---------- */
.marquee{background:var(--accent);color:#13302f;overflow:hidden;white-space:nowrap}
.marquee div{display:inline-flex;gap:36px;padding-block:14px;font-family:var(--f-display);font-weight:700;font-size:clamp(16px,2vw,22px);animation:mq 32s linear infinite}
.marquee span::after{content:"✦";margin-left:36px;font-size:.8em}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
section.block{padding-block:clamp(70px,10vw,130px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.sec-head h2{font-size:clamp(30px,4.6vw,58px);max-width:16ch}
.sec-head p{max-width:42ch;color:var(--fg-dim);margin:0}
.cats{background:var(--alt-bg);color:var(--alt-fg);transition:background-color .6s var(--ease)}
.cats .sec-head p{color:var(--alt-dim)}
.cats .eyebrow{color:var(--alt-accent)}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;perspective:1000px}
@media (max-width:900px){.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;text-align:left;transform-style:preserve-3d;transition:transform .9s var(--ease),box-shadow .9s var(--ease);box-shadow:0 20px 40px -28px rgba(0,0,0,.6);background:#fff}
.cat .ph{position:absolute;inset:0;width:100%;height:100%}
.cat .lbl{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;transform:translateZ(40px)}
.cat .lbl b{font-family:var(--f-display);font-size:clamp(14px,1.6vw,19px);font-weight:600;color:#0d2828;background:rgba(255,255,255,.85);padding:7px 12px;border-radius:999px}
.cat .lbl span{font-size:11px;font-weight:800;background:#0d2828;color:#ece4f4;border-radius:999px;padding:5px 9px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--fg-dim)}
.chip:hover{color:var(--fg);border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:800}
.toolbar .sp{flex:1}
.toolbar label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim)}
.sel{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .8s var(--ease),border-color .4s,box-shadow .8s var(--ease);min-width:0}
.card:hover{transform:translateY(-8px);border-color:rgba(244,167,124,.55);box-shadow:0 26px 40px -26px rgba(0,0,0,.45)}
.card .pic{position:relative;aspect-ratio:4/5;border:0;padding:0;background:none;display:block;width:100%;overflow:hidden}
.card .pic .ph{width:100%;height:100%;transition:transform 1.1s var(--ease)}

footer{padding-block:60px calc(40px + env(safe-area-inset-bottom,0px))}

/* ---------- modal & drawer ---------- */
.veil{position:fixed;inset:0;background:rgba(5,18,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}

.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}

.li .ph{width:64px;height:64px;border-radius:12px;overflow:hidden}

.li small{color:var(--fg-dim);font-size:12px}

.total{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.d-foot form{display:flex;flex-direction:column;gap:8px}

.note{font-size:13px;background:rgba(156,199,176,.15);border:1px solid rgba(156,199,176,.45);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:100;transition:transform .7s var(--ease);box-shadow:0 20px 40px -15px rgba(0,0,0,.45)}
.toast.on{transform:translate(-50%,0)}
.toast{opacity:0;visibility:hidden;pointer-events:none;transition:transform .7s var(--ease),opacity .4s,visibility 0s .7s}
.toast.on{opacity:1;visibility:visible;transition:transform .7s var(--ease),opacity .3s,visibility 0s}

/* magnetic buttons */
.btn,.add,.cart-btn,.chip,.tags button,.sz,.x,.flink,.theme,.lang button,.f-btn{transition-property:transform,translate,box-shadow,background,color,border-color;transition-duration:.7s;transition-timing-function:var(--ease)}
.mag-on{transition-duration:.25s}
.mag-in{display:inline-flex;align-items:center;gap:inherit;transition:translate .7s var(--ease)}

/* ================= redesign pass ================= */
/* grain: breaks digital flatness, never catches clicks */
body::after{content:"";position:fixed;inset:0;z-index:120;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("grain.svg")}
/* eyebrows: sentence case with a hairline lead instead of shouting caps */
.eyebrow{text-transform:none;letter-spacing:.01em;font-size:13.5px;font-weight:800;display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1.5px;border-radius:2px;background:currentColor;opacity:.8}
.reveal .eyebrow{justify-content:center}
.sec-head h2,.reveal h2{letter-spacing:-.02em}
/* flags instead of pills */
.badge{border-radius:4px;letter-spacing:.04em}
/* press feedback on every control */
.btn:active,.add:active,.chip:active,.sz:active,.cart-btn:active,.theme:active,.tags button:active,.f-btn:active{scale:.96;transition-duration:.12s}
/* tinted shadows (hue of the eucalyptus ground, not black) */
.card:hover{box-shadow:0 26px 44px -26px rgba(4,34,32,.55)}
.fcard{box-shadow:0 30px 60px -22px rgba(4,34,32,.55)}
.cat{box-shadow:0 22px 40px -28px rgba(4,34,32,.6)}
/* spotlight border that follows the cursor on catalog cards */
.card{position:relative;--mx:-300px;--my:-300px;border-radius:20px}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);
  background:radial-gradient(240px circle at var(--mx) var(--my), rgba(244,167,124,.95), rgba(185,163,227,.5) 40%, transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card:hover::before{opacity:1}
.sz{border-radius:9px}
/* current section in the nav */
.nav a{position:relative;padding-block:4px}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;border-radius:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.nav a:hover::after,.nav a[aria-current="true"]::after{transform:scaleX(1)}
.nav a[aria-current="true"]{color:var(--fg)}
/* size table rows answer the pointer */
tbody tr{transition:background .3s}
tbody tr:hover{background:var(--surface-hi)}
/* skip link */
.skip{position:fixed;left:16px;top:-60px;z-index:130;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:800;text-decoration:none;transition:top .3s var(--ease)}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
/* staggered reveal, applied by JS only to items that start below the first screen */
.pre{opacity:0;transform:translateY(26px)}
.in{transition:opacity .9s var(--ease),transform 1.1s var(--ease);transition-delay:var(--d,0s)}
/* inline form errors */
.field{display:flex;flex-direction:column;gap:4px}
.d-foot input[aria-invalid="true"]{border-color:#e07a6a}
.err{font-size:12px;color:#ff9c8c}
.err:empty{display:none}
:root[data-site="light"] .err{color:#b8432f}
