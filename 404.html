<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінку не знайдено | KONOTOP STUDIO</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" id="fonts" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Manrope:wght@400;600&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Manrope:wght@400;600&display=swap"></noscript>
  <script src="/js/404.js"></script>
  <style>
    html[data-theme="dark"] { color-scheme: dark; --bg: #000000; --fg: #FAFAFA; --muted: #94A3B8; --line: #3F3F46; --stroke: #52525B; --grid: rgba(255,255,255,.045); }
    html[data-theme="light"] { color-scheme: light; --bg: #FAFAFA; --fg: #09090B; --muted: #52525B; --line: #D4D4D8; --stroke: #A1A1AA; --grid: rgba(9,9,11,.06); }
    html[lang="uk"] [lang="en"], html[lang="en"] [lang="uk"] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      padding-inline: clamp(20px, 4vw, 60px);
      background-color: var(--bg);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 88px 88px;
      color: var(--fg);
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; min-height: 84px; font-family: "Inter Tight", sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
    .logo i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 14px; font-style: normal; font-weight: 800; }
    main { display: flex; flex: 1; flex-direction: column; justify-content: center; max-width: 760px; padding-block: 48px 96px; }
    .code { margin-bottom: 8px; color: transparent; -webkit-text-stroke: 1.5px var(--stroke); font-family: "Inter Tight", sans-serif; font-size: clamp(120px, 24vw, 280px); font-weight: 800; letter-spacing: -.05em; line-height: .85; }
    h1 { margin-bottom: 16px; font-family: "Inter Tight", sans-serif; font-size: clamp(36px, 6vw, 64px); font-weight: 600; letter-spacing: -.035em; line-height: 1.05; text-wrap: balance; }
    p { max-width: 32em; margin-bottom: 32px; color: var(--muted); font-size: 18px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; min-height: 52px; padding-inline: 24px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 600; transition: transform 160ms cubic-bezier(.23, 1, .32, 1); }
    .btn:active { transform: scale(.97); }
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise 600ms cubic-bezier(.23, 1, .32, 1) backwards; }
      main > :nth-child(2), main > :nth-child(3) { animation-delay: 80ms; }
      main > :nth-child(4), main > :nth-child(5) { animation-delay: 160ms; }
      main > :nth-child(6), main > :nth-child(7) { animation-delay: 240ms; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    }
  </style>
</head>

<body>
  <a class="logo" href="/" id="logo" translate="no"><i aria-hidden="true">K</i>KONOTOP STUDIO</a>

  <main>
    <div class="code" aria-hidden="true">404</div>

    <h1 lang="uk">Цієї сторінки немає</h1>
    <h1 lang="en">This page doesn’t exist</h1>

    <p lang="uk">Можливо, посилання застаріло або в адресі є помилка.</p>
    <p lang="en">The link may be out of date, or the address may contain a typo.</p>

    <a class="btn" href="/" lang="uk">Перейти на головну</a>
    <a class="btn" href="/en/" lang="en">Go to the homepage</a>
  </main>

</body>
</html>
